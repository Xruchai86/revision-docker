<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>ReVision (Docker)</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header>
  <div class="brand">
    <div class="mark">▶</div>
    <h1>ReVision</h1>
    <span class="sub">Docker / VAAPI · Temp: {{ temp_root }}</span>
  </div>
</header>

<main>
  <section class="setup-row">
    <div class="field">
      <label>Quellordner (im Container)</label>
      <div class="path-picker">
        <input type="text" id="inputFolder" placeholder="/media/source" readonly>
        <button class="btn-ghost" onclick="openBrowser()">Durchsuchen…</button>
      </div>
    </div>
    <div class="field">
      <label>Zielordner</label>
      <input type="text" id="outputFolder" value="{{ settings.output_folder }}" placeholder="/media/output">
    </div>
    <div class="field" style="flex:0 0 200px">
      <label>Qualitätsprofil</label>
      <select id="profileSelect">
        {% for key, p in profiles.items() %}
        <option value="{{ key }}" {% if key == settings.quality_profile %}selected{% endif %}>{{ p.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="field" style="flex:0 0 220px">
      <label>Ziel-Bitrate Video (Mbit/s) - überschreibt Profil-Standard</label>
      <div class="bitrate-slider">
        <input type="range" id="targetBitrateSlider" min="5" max="60" step="1"
               value="{{ settings.target_bitrate_mbps|int }}"
               oninput="document.getElementById('targetBitrateValue').textContent = this.value">
        <span id="targetBitrateValue">{{ settings.target_bitrate_mbps|int }}</span>
      </div>
    </div>
    <div class="field" style="flex:0 0 150px">
      <label>Downsize-Schwelle (Mbit/s)</label>
      <input type="number" id="downsizeThreshold" value="{{ settings.downsize_threshold_mbps }}">
    </div>
    <button class="btn-gold" onclick="scan()" id="scanBtn" disabled>Scannen</button>
  </section>

  <div id="scanStatus" class="status-line"></div>

  <h2>Warteschlange</h2>
  <table id="jobsTable">
    <thead><tr><th>Datei</th><th>Art</th><th>Status</th><th>Log</th></tr></thead>
    <tbody id="jobsBody"></tbody>
  </table>
</main>

<!-- Ordner-Browser-Popup -->
<div id="browseModal" class="modal" style="display:none">
  <div class="modal-content">
    <h2 style="margin-top:0">Quellordner wählen</h2>
    <div id="browseBreadcrumb" class="breadcrumb"></div>
    <div id="browseList" class="browse-list"></div>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeBrowser()">Abbrechen</button>
      <button class="btn-gold" onclick="chooseCurrentFolder()">Diesen Ordner wählen &amp; scannen</button>
    </div>
  </div>
</div>

<!-- Scan-Ergebnisse-Popup -->
<div id="resultsModal" class="modal" style="display:none">
  <div class="modal-content modal-wide">
    <h2 style="margin-top:0">Scan-Ergebnisse</h2>
    <div class="results-toolbar">
      <label><input type="checkbox" id="selectAll" onclick="toggleAll(this)"> Alle auswählen</label>
      <span id="resultsCount" class="status-line"></span>
    </div>
    <table id="resultsTable">
      <thead>
        <tr><th style="width:30px"></th><th>Datei</th><th>Empfehlung</th></tr>
      </thead>
      <tbody id="resultsBody"></tbody>
    </table>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeResults()">Abbrechen</button>
      <button class="btn-gold" onclick="processSelected()">Ausgewählte verarbeiten</button>
    </div>
  </div>
</div>

<div id="logModal" class="modal" style="display:none">
  <div class="modal-content">
    <button class="btn-ghost" style="float:right" onclick="closeLog()">Schließen</button>
    <pre id="logContent"></pre>
  </div>
</div>

<script>
  window.SAVED_THRESHOLD = {{ settings.downsize_threshold_mbps }};
  window.PROFILE_TARGET_MBPS = {
    {% for key, p in profiles.items() %}"{{ key }}": {{ p.target_mbps }}{{ "," if not loop.last }}{% endfor %}
  };
</script>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
